<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark light">
  <title>DSH Hub · DSH 中枢</title>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/views.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient-orb ambient-orb-a"></div>
    <div class="ambient-orb ambient-orb-b"></div>
    <div class="ambient-grid"></div>
  </div>

  <div id="app" class="app-shell is-booting">
    <div class="boot-screen" id="boot-screen">
      <div class="boot-logo" id="boot-logo"></div>
      <div class="boot-title">DSH HUB</div>
      <div class="boot-subtitle">正在连接 DeepSeek Harness…</div>
      <div class="boot-track"><span></span></div>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root" class="overlay-root"></div>
  <div id="drawer-root" class="overlay-root"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
